<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="340" rx="14" fill="#0f172a"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="450" y="36" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Draft legal text from your own precedent, through any MCP client</text>
<g font-size="14" text-anchor="middle">
<text x="125" y="84" fill="#94a3b8" font-weight="700">ONCE: FILL THE VAULT</text>
<rect x="30" y="100" width="190" height="86" rx="10" fill="#1e293b" stroke="#38bdf8"/>
<text x="125" y="130" fill="#38bdf8" font-weight="700">Your documents</text><text x="125" y="152" fill="#cbd5e1" font-size="13">contracts, precedent,</text><text x="125" y="170" fill="#cbd5e1" font-size="13">prior work</text>
<rect x="30" y="226" width="190" height="70" rx="10" fill="#1e293b" stroke="#fbbf24"/>
<text x="125" y="256" fill="#fbbf24" font-weight="700">The vault</text><text x="125" y="276" fill="#cbd5e1" font-size="13">searchable by meaning</text>
<text x="138" y="212" fill="#94a3b8" font-size="12" text-anchor="start">ingest_document</text>
<text x="590" y="84" fill="#94a3b8" font-weight="700">EVERY TIME: ASK, FIND, DRAFT</text>
<rect x="260" y="100" width="190" height="86" rx="10" fill="#1e293b" stroke="#38bdf8"/>
<text x="355" y="130" fill="#38bdf8" font-weight="700">You ask</text><text x="355" y="152" fill="#cbd5e1" font-size="13">for example: draft an</text><text x="355" y="170" fill="#cbd5e1" font-size="13">indemnification clause</text>
<rect x="480" y="100" width="190" height="86" rx="10" fill="#1e293b" stroke="#fbbf24"/>
<text x="575" y="130" fill="#fbbf24" font-weight="700">Find similar passages</text><text x="575" y="152" fill="#cbd5e1" font-size="13">in your vault</text><text x="575" y="172" fill="#94a3b8" font-size="12">search_legal_vault</text>
<rect x="700" y="100" width="170" height="196" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
<text x="785" y="130" fill="#fb923c" font-weight="700">Draft grounded</text><text x="785" y="150" fill="#fb923c" font-weight="700">in those passages</text>
<text x="785" y="182" fill="#cbd5e1" font-size="13">a clause</text><text x="785" y="202" fill="#cbd5e1" font-size="13">a legal memo</text><text x="785" y="222" fill="#cbd5e1" font-size="13">a summary</text>
<text x="785" y="250" fill="#94a3b8" font-size="12">draft_clause</text><text x="785" y="266" fill="#94a3b8" font-size="12">draft_legal_memo</text><text x="785" y="282" fill="#94a3b8" font-size="12">summarize_document</text>
</g>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M125 188 V224"/><path d="M452 143 H478"/><path d="M672 143 H698"/><path d="M222 261 C 330 261, 470 230, 560 190"/></g>
<text x="450" y="324" fill="#94a3b8" font-size="12" text-anchor="middle">Drafting is done by an LLM (Anthropic API). Retrieval uses Voyage AI embeddings and a Pinecone index. Details in the README.</text>
</svg>
